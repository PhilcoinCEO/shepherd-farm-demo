<style>

:root{

--hay:#8BA556; --hay-ink:#132011; --ok:#3F7D2A; --warn:#A87418; --crit:#A8382B;

--rail:#18291B; --rail-ink:#F2ECDC; --rail-gold:#A9C27A;

--bg-art:radial-gradient(900px 520px at 100% -10%,rgba(120,150,62,.22),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(76,138,46,.16),transparent 60%),repeating-linear-gradient(135deg,rgba(95,102,80,.045) 0 2px,transparent 2px 14px);
--r:12px;
}

--hay:#9DB86A; --hay-ink:#101A0E; --ok:#7CC25A; --warn:#E0A945; --crit:#EE7E6C;
--ok-bg:#1A3218; --warn-bg:#33280F; --crit-bg:#3A1C16;
--rail:#0A140C; --rail-ink:#EEE8D6; --rail-gold:#9DB86A; color-scheme:dark; --card:var(--surface); --card-kpi:linear-gradient(155deg,#1B2C1F 0%,#16241A 100%); --card-row:#1A2A1E; --card-glow:0 6px 18px -12px rgba(0,0,0,.6); --bg-art:radial-gradient(900px 520px at 100% -10%,rgba(157,184,106,.14),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(111,174,76,.12),transparent 60%),radial-gradient(1px 1px at 20% 30%,rgba(238,232,214,.35),transparent 1.5px),radial-gradient(1px 1px at 70% 12%,rgba(238,232,214,.3),transparent 1.5px),radial-gradient(1px 1px at 45% 8%,rgba(238,232,214,.25),transparent 1.5px),repeating-linear-gradient(135deg,rgba(238,232,214,.025) 0 2px,transparent 2px 14px);}}

--ok-bg:#1A3218; --warn-bg:#33280F; --crit-bg:#3A1C16;
--rail:#0A140C; --rail-ink:#EEE8D6; --rail-gold:#9DB86A; color-scheme:dark; --card:var(--surface); --card-kpi:linear-gradient(155deg,#1B2C1F 0%,#16241A 100%); --card-row:#1A2A1E; --card-glow:0 6px 18px -12px rgba(0,0,0,.6); --bg-art:radial-gradient(900px 520px at 100% -10%,rgba(157,184,106,.14),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(111,174,76,.12),transparent 60%),radial-gradient(1px 1px at 20% 30%,rgba(238,232,214,.35),transparent 1.5px),radial-gradient(1px 1px at 70% 12%,rgba(238,232,214,.3),transparent 1.5px),radial-gradient(1px 1px at 45% 8%,rgba(238,232,214,.25),transparent 1.5px),repeating-linear-gradient(135deg,rgba(238,232,214,.025) 0 2px,transparent 2px 14px);}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:var(--bg-art);background-attachment:fixed;color:var(--fg);transition:background-color .25s,color .25s;font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hay);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);background-image:radial-gradient(120% 60% at 50% 0%,rgba(169,194,122,.16),transparent 60%);color:var(--rail-ink);border-right:3px solid var(--rail-gold);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em;line-height:1.15;color:var(--rail-ink)}
.brand img{width:176px;max-width:100%;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand .tagline{font-family:var(--f-display);font-size:11px;letter-spacing:.18em;color:var(--rail-gold);border-top:1px solid rgba(169,194,122,.5);border-bottom:1px solid rgba(169,194,122,.5);padding:3px 8px}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;opacity:.75;letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:inherit;font-weight:600;display:flex;align-items:center;gap:10px;opacity:.85}
.nav button svg{width:18px;height:18px;flex:none}
.nav button[aria-current="page"]{background:rgba(255,255,255,.16);opacity:1}

.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
.main{min-width:0;padding-block:20px 96px;padding-inline:clamp(16px,3vw,36px)}

@media (max-width:640px){.topbar{align-items:flex-start}.tb-main{flex-direction:column;align-items:flex-start}.desk-only{display:none!important}.tb-me.phone-only{display:flex}.tb-me .seg.theme button{padding:4px 7px}}
.topbar h1{font-family:var(--f-display);font-weight:700;color:var(--pasture);letter-spacing:.01em;font-size:30px;margin:0;line-height:1;text-wrap:balance}
.topbar .sub{color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg.theme button{padding:6px 10px;display:inline-flex;align-items:center} .seg.theme svg{width:16px;height:16px}
:root[data-theme="light"]{color-scheme:light}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--hay);color:var(--hay-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.demo{background:var(--warn-bg);color:var(--fg);border:1px dashed var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--pasture);box-shadow:var(--card-glow);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;color:var(--pasture);font-size:18px;padding-bottom:8px;border-bottom:2px solid var(--hay);margin:0 0 12px;letter-spacing:.01em}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card-kpi);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-family:var(--f-display);color:var(--pasture);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi.crit b{color:var(--crit)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

.tag{display:inline-grid;place-items:center;min-width:46px;height:30px;padding:0 8px;background:var(--hay);color:var(--hay-ink);font-family:var(--f-mono);font-weight:700;font-size:13px;border-radius:6px 6px 12px 12px;position:relative;flex:none}

.tag.group::before{background:var(--muted)}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

.task.done .t-title{text-decoration:line-through}

.check.sm:checked::after{width:4px;height:9px;border-width:0 2px 2px 0}
.t-title{font-weight:600}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;color:var(--muted);font-size:13px;align-items:center}
.sub-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.sub-list label{display:flex;gap:8px;align-items:center;font-size:14px}
.prio-high{border-left:4px solid var(--crit)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--pasture);color:var(--pasture-ink);border-color:var(--pasture)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--pasture);color:var(--pasture-ink);border-color:var(--pasture)}
.animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.acard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%}
.acard:hover{border-color:var(--pasture)}
.acard .nm{font-weight:700}
.acard .meta{color:var(--muted);font-size:13px}
.profile-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.profile-head .tag{height:44px;min-width:64px;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.facts div b{display:block;font-weight:600}
.spark{width:100%;height:120px;display:block}
.timeline .row .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:84px;flex:none;padding-top:2px}
form.stack{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.inline{display:flex;gap:10px;flex-wrap:wrap}
.inline>.field{min-width:0;flex:1 1 140px}.field input[type=date]{min-width:0;width:100%;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none}
.area-grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}.area-grp:first-of-type{margin-top:2px}
.inline>.field{flex:1 1 140px}
/* Agent */
.agent{display:grid;grid-template-rows:1fr auto;height:calc(100vh - 150px);min-height:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.msgs{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(640px,92%);padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}

.msg.ai{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg img{display:block;max-width:220px;border-radius:8px;margin-bottom:6px}
.receipt{align-self:flex-start;font-size:13px;display:flex;gap:6px;align-items:center;color:var(--ok);font-weight:600}
.receipt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.composer .bar{display:flex;gap:8px;align-items:flex-end}

.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.attach{display:flex;gap:8px;align-items:center;font-size:13px}
.attach img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.login{max-width:520px;margin:6vh auto 0}
body.signed-out .app{grid-template-columns:1fr}
body.signed-out .rail{display:none}
body.signed-out .main{padding-bottom:0}
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));position:relative}

.gate-form .btn.primary{width:100%;font-size:17px;padding:14px;border-radius:12px;margin-top:4px}
.gate-ok{color:var(--pasture);font-weight:800;font-size:14px;letter-spacing:.06em;margin:-14px 0 16px}
.gate-list{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}

.scan-ov{position:fixed;inset:0;z-index:9000;background:#0f1a12;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
.sc-top{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;font-size:1.15rem}

.gate-face{display:flex;align-items:center;justify-content:center;gap:10px}
.gate-err{min-height:18px;color:var(--crit);font-size:14px;text-align:center}
.gate .who-btn.gate-admin{border-color:var(--rail-gold,#A9C27A);border-style:dashed}.gate .who-btn.gate-admin .avatar{background:var(--rail,#18291B);color:var(--rail-gold,#A9C27A);display:grid;place-items:center}

// Translate short record text into the other language so every entry reads in English and Spanish.
async function bilingual(texts){
const cur=lang, blank=texts.map(()=>"");
const fallback = cur==="es"?{en:blank,es:texts}:{en:texts,es:blank};
if(!S.sample || !texts.some(x=>x)) return fallback;
try{
const out=await S.sample.json(`Translate each item from ${cur==="es"?"Spanish to English":"English to Spanish (Puerto Rico)"} for farm staff records. Keep numbers, ear tag IDs, animal names and units unchanged. Empty strings stay empty. Reply with only a JSON array of strings in the same order and length.\n\n${JSON.stringify(texts)}`,{modelTier:"quick"});
if(Array.isArray(out)&&out.length===texts.length){ const tr=out.map(x=>String(x??"")); return cur==="es"?{en:tr,es:texts}:{en:texts,es:tr}; }
}catch(e){ console.warn("translate",e&&e.code); }
return fallback;
}

async function addEvent(animalId,{type,note,note_es,lb,eggs,pen,due,meta}){
const a=S.animals.find(x=>x.id===animalId); if(!a) throw new Error("Animal not found: "+animalId);
if(S.busy && S.agentPhoto && !(meta&&meta.photoIds&&meta.photoIds.length)){
if(!S.agentPhotoId && S.assets){ try{ S.agentPhotoId=(await S.assets.upload(S.agentPhoto)).id; }catch(e){ console.warn("agent photo",e&&e.code); } }
if(S.agentPhotoId) meta=Object.assign({},meta,{photoIds:[S.agentPhotoId]}); }
const ev=Object.assign({d:today(),type,note:note||"",note_es:note_es||""},evMeta(a,meta));
const patch={};
if(lb!=null){ const w=(a.weights||[]).concat([{d:today(),lb:Number(lb)}]).slice(-60); patch.weights=w; if(!ev.note&&!ev.note_es){ ev.note=`${lb} lb`; ev.note_es=`${lb} lb`; } }
if(eggs!=null){ const p=(a.production||[]).filter(x=>x.d!==today()).concat([{d:today(),eggs:Number(eggs)}]).slice(-60); patch.production=p; if(!ev.note&&!ev.note_es){ ev.note=`${eggs} eggs`; ev.note_es=`${eggs} huevos`; } }
if(pen){ ev.note = `${a.pen||a.pen_es||"?"} → ${pen}${note?". "+note:""}`; ev.note_es = `${a.pen_es||a.pen||"?"} → ${pen}${note_es?". "+note_es:""}`; patch.pen=pen; patch.pen_es=""; }
if(due&&due.d){ patch.due=(a.due||[]).filter(x=>!(x.d===due.d&&x.what===due.what)).concat([{d:due.d,what:due.what||"",what_es:due.what_es||"",by:meObj()?.name||""}]).slice(-40);
if(!ev.note&&!ev.note_es){ ev.note=`Scheduled: ${due.what||due.what_es} on ${due.d}`; ev.note_es=`Programado: ${due.what_es||due.what} el ${due.d}`; } }
patch.events=[ev].concat(a.events||[]).slice(0,120);
await writeDoc("animals",a.id,()=>S.db.collection("animals").doc(a.id).update(patch));
return ev;
}

async function checkPin(st,pin,errEl,form){
if(!/^\d{4}$/.test(pin)){ errEl.textContent=T2("PIN is 4 digits.","El PIN tiene 4 dígitos."); return false; }
const wait=(pinFails[st.id]||{}).until||0; if(Date.now()<wait){ errEl.textContent=T2("Too many tries. Wait a few minutes.","Demasiados intentos. Espere unos minutos."); return false; }
if(!st.pinHash&&DEMO){ await saveStaff(st.id,{pinHash:await pinHash(st.id,pin)}); pinFails[st.id]={n:0}; return true; } // demo only: first PIN typed becomes the PIN
if(!st.pinHash){ errEl.textContent=T2("No PIN on file. Ask the administrator to reset your access.","No tiene PIN. Pida al administrador que restablezca su acceso."); return false; }
if(st.pinHash!==await pinHash(st.id,pin)){ const pf=pinFails[st.id]=pinFails[st.id]||{n:0}; pf.n++;
if(pf.n>=(st.role==="admin"?3:5)){ pf.until=Date.now()+(st.role==="admin"?5:1)*60000; pf.n=0; }
errEl.textContent=T2("Wrong PIN.","PIN incorrecto."); form&&form.reset(); return false; }
pinFails[st.id]={n:0}; return true; }

function renderToday(){

const mine = isAdmin()? list : list.filter(tk=>tk.assignee===me.id);
const doneN = mine.filter(taskDoneToday).length;
const sorted = mine.slice().sort((a,b)=>(taskDoneToday(a)-taskDoneToday(b)) || ((b.priority==="high")-(a.priority==="high")));
const care = careItems().filter(x=>x.n<=3);
const dateStr = new Date().toLocaleDateString(lang==="es"?"es-PR":"en-US",{weekday:"long",month:"long",day:"numeric"});

function drawSpark(id,pts,unit){
const svg=document.getElementById(id); if(!svg||!pts.length) return;
const W=svg.clientWidth||320,H=120,p={l:44,r:12,t:12,b:22};
const ys=pts.map(x=>x.v); let lo=Math.min(...ys),hi=Math.max(...ys); if(lo===hi){lo-=1;hi+=1;} const pad=(hi-lo)*.1; lo-=pad; hi+=pad;
const X=i=>p.l+(pts.length===1?(W-p.l-p.r)/2:i*(W-p.l-p.r)/(pts.length-1)); const Y=v=>p.t+(1-(v-lo)/(hi-lo))*(H-p.t-p.b);
const line=pts.map((q,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(q.v).toFixed(1)}`).join("");
const area=line+`L${X(pts.length-1).toFixed(1)},${H-p.b}L${X(0).toFixed(1)},${H-p.b}Z`;
const ticks=[lo+pad,(lo+hi)/2,hi-pad];
const last=pts[pts.length-1];
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.innerHTML = ticks.map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${Math.round(v)}</text>`).join("")
+ `<path d="${area}" fill="var(--pasture)" fill-opacity=".12"/><path d="${line}" fill="none" stroke="var(--pasture)" stroke-width="2.5" stroke-linejoin="round"/>`
+ `<circle cx="${X(pts.length-1)}" cy="${Y(last.v)}" r="4.5" fill="var(--hay)" stroke="var(--surface)" stroke-width="2"/>`
+ `<text x="${p.l}" y="${H-5}" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${esc(pts[0].d)}</text><text x="${W-p.r}" y="${H-5}" text-anchor="end" font-size="11" fill="var(--fg)" font-family="var(--f-mono)" font-weight="700">${esc(last.d)} · ${last.v} ${unit}</text>`;
}
function drawCharts(){ const a=S.animals.find(x=>x.id===S.animalId); if(!a) return;
drawSpark("chartW",(a.weights||[]).map(w=>({d:w.d,v:w.lb})),t("lb")); drawSpark("chartP",(a.production||[]).map(w=>({d:w.d,v:w.eggs})),t("eggs")); }

function summary(a){ return {id:a.id,tag:a.tag,name:a.name||"",species:a.species,kind:a.kind,breed:a.breed||"",sex:a.sex||"",pen:a.pen||"",count:a.count,status:a.status||"",color:a.color||"",
lastWeight:(a.weights||[]).slice(-1)[0]||null,lastEggs:(a.production||[]).slice(-1)[0]||null}; }
function findAnimal(q){ q=String(q||"").toLowerCase().trim(); if(!q) return [];
const terms=q.split(/\s+/);
return S.animals.map(a=>{ const hay=[a.tag,a.name,a.name_es,a.species,STR.en[a.species],STR.es[a.species],a.breed,a.pen,a.pen_es,a.color,a.color_es,a.sex,VOCAB[a.sex]].join(" ").toLowerCase();
let s=0; for(const w of terms){ if(String(a.tag).toLowerCase()===w) s+=5; else if(hay.includes(w)) s+=1; } return {a,s}; })
.filter(x=>x.s>0).sort((x,y)=>y.s-x.s).slice(0,6).map(x=>summary(x.a)); }
function agentTools(){
const need=id=>{ const a=S.animals.find(x=>x.id===String(id)||String(x.tag)===String(id)); if(!a) throw new Error("No animal with id or tag "+id+". Use search_animals first."); return a; };
const needW=id=>{ const a=need(id); if(!canWork(a.species)) throw new Error("This employee has not passed the "+TRAIN[AREA_OF[a.species]].title[0]+" training yet, so they cannot change this record. Tell them to finish it or ask the administrator."); return a; };
const receipt=txt=>{ S.chat.push({kind:"receipt",text:txt}); };
const ro=()=>{ if(!S.canWrite) throw new Error("This user has view-only access and cannot change records."); };
return [
{name:"search_animals",description:"Find animal or flock records by ear tag number, name, species, breed, color or pen. Returns up to 6 matches with id, tag, name, species and last weight.",
inputSchema:{type:"object",properties:{query:{type:"string"}},required:["query"]},execute:i=>findAnimal(i.query)},
{name:"get_animal",description:"Get the full record for one animal or flock by id or tag: profile, weight or egg history, upcoming care items and the 15 most recent history entries.",
inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
execute:i=>{ const a=need(i.id); return Object.assign(summary(a),{born:a.born||"",dam:a.dam||"",weights:(a.weights||[]).slice(-12),production:(a.production||[]).slice(-14),due:a.due||[],events:(a.events||[]).slice(0,15)}); }},
{name:"log_entry",description:"Add a history entry to an animal or flock. type is one of health, treatment, feed, movement, breeding, obs. Use for observations, treatments given, feed changes.",
inputSchema:{type:"object",properties:{id:{type:"string"},type:{type:"string",enum:["health","treatment","feed","movement","breeding","obs"]},note_en:{type:"string",description:"The note in English"},note_es:{type:"string",description:"The same note in Spanish"}},required:["id","type","note_en","note_es"]},
execute:async i=>{ ro(); const a=needW(i.id); await addEvent(a.id,{type:String(i.type),note:String(i.note_en||i.note||""),note_es:String(i.note_es||"")}); receipt(`${t(i.type)} · ${animalLabel(a)}`); return "Logged."; }},
{name:"log_weight",description:"Record a weight in pounds for an individual animal.",
inputSchema:{type:"object",properties:{id:{type:"string"},lb:{type:"number"}},required:["id","lb"]},
execute:async i=>{ ro(); const a=needW(i.id); const lb=Number(i.lb); if(!(lb>0)) throw new Error("Weight must be a positive number of pounds."); await addEvent(a.id,{type:"obs",lb}); receipt(`${t("weight")} ${lb} ${t("lb")} · ${animalLabel(a)}`); return "Weight saved."; }},
{name:"log_eggs",description:"Record today's egg count for a laying flock.",
inputSchema:{type:"object",properties:{id:{type:"string"},eggs:{type:"number"}},required:["id","eggs"]},

function instructions(){
const herd=S.animals.map(a=>`${a.tag}${a.name?" "+a.name:""} (${a.species}${a.kind==="group"?", flock of "+(a.count||0):""}, ${a.breed||""}, pen ${a.pen||"?"}${a.color?", "+a.color:""})`).join("; ");
return `You are Shepherd, the animal-care agent inside the operating system of La Finca Pastoreo (chickens, cattle, pigs, horses, sheep).
Today is ${today()}. You are talking with ${meObj()?.name} (${meObj()?.role}). Reply in ${lang==="es"?"Spanish (Puerto Rico)":"English"}. Be brief and practical: short sentences, no markdown headers, no tables.
Staff (id: name, role): ${S.staff.map(s=>`${s.id}: ${s.name}, ${s.role}`).join("; ")}.
Animals on file: ${herd}.
Rules:
1. Identity: never write to a record unless you are sure which animal it is. If a request or photo matches more than one record, list the likely matches (tag and name) and ask which one. With a photo, read any visible ear tag first, then use species, color and markings, and state your confidence as a percentage. If confidence is under 90%, ask the person to confirm before logging anything.
2. Health: describe what you can see or what was reported and flag concerns, but never diagnose and never prescribe drugs or doses. When something looks wrong, suggest a vet check and offer to create a high-priority task.
3. Actions: use the tools to read and write records. After a write, confirm in one line what you saved. Ask a short clarifying question when the person's intent is unclear (for example: log a health note, create a vet task, or both?).
4. Chickens and pigs are often tracked as flocks or groups; log to the group record.
5. When someone says an animal needs something on a future date, call schedule_care with that date (next upcoming date if no year). If the tag they said is not on file, say so and list close matches; never create a record for a tag that does not exist.
6. Staff read records in English and Spanish. Every note and task you save must be written in both languages (the _en and _es fields), whichever language the person used.`;
}
async function ask(text){
if(S.busy||!S.sample) return; text=String(text||"").trim(); const photo=S.photo;
if(!text && !photo) return;
const shown = text || t("whichAnimal");
S.chat.push({role:"user",text:shown,img:photo?photo.url:null});
const ai=document.getElementById("askIn"); if(ai) ai.value="";
S.agentPhoto=photo?photo.file:null; S.agentPhotoId=null;
S.photo=null; S.busy=true; S.streamText=""; S.ctl=new AbortController(); render();
const turns=[{role:"user",content:instructions()}].concat(S.chat.filter(m=>m.role).slice(-12).map(m=>({role:m.role,content:m.img?m.text+"\n[A photo was attached to this message.]":m.text})));
try{
const opts={signal:S.ctl.signal,tools:agentTools(),onText:({text})=>{S.streamText=text; const el=document.getElementById("streaming"); if(el) el.textContent=text; const m=document.getElementById("msgs"); if(m) m.scrollTop=m.scrollHeight;}};
if(photo) opts.images=[photo.file];
const res=await S.sample(turns,opts);
S.chat.push({role:"assistant",text:res.text+(res.truncated?" …":"")}); if(S.speak) sayAloud(res.text);
}catch(e){
const partial=e&&e.text; if(partial) S.chat.push({role:"assistant",text:partial});
const map={cancelled:"",not_granted:lang==="es"?"No se permitió usar Claude en esta página.":"Claude wasn't allowed on this page.",rate_limited:lang==="es"?"Demasiadas solicitudes. Intenta en un momento.":"Too many requests right now. Try again in a moment.",image_rejected:lang==="es"?"No pude leer esa foto. Prueba otra.":"That photo couldn't be read. Try a different one.",images_unavailable:lang==="es"?"Esta vista no puede enviar fotos.":"Photos can't be sent from this view.",tools_unavailable:lang==="es"?"Esta vista no permite que el agente cambie registros.":"This view can't let the agent change records."};
const msg = e&&e.code in map ? map[e.code] : (lang==="es"?"Algo falló. Intenta de nuevo.":"Something went wrong. Try again.");
if(msg) S.chat.push({kind:"receipt",text:msg});
if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)) S.sample=null;
}finally{ S.busy=false; S.ctl=null; S.streamText=""; render(); }
}

"species": one of "cow","horse","sheep","pig","chicken";
"kind": "group" if it shows a flock or pen of several animals of the same species, otherwise "individual";
"tag": the ear tag, leg band or brand number exactly as you can read it, or "" if none is clearly readable (never invent one);
"breed": your best breed guess in English, or "";
"sex": "Female","Male","Castrated male","Mixed" or "" if you cannot tell;
"color": short coat color and markings in English; "color_es": the same in Spanish;
"count": number of animals visible;
"confidence": 0-100, how sure you are of species and breed together;
"summary_en": one sentence on what you see, including any visible injury, limp posture or thin body condition as an observation only, never a diagnosis; "summary_es": the same sentence in Spanish.`,{images:[file]});

const med=/vaccin|booster|deworm|vacuna|desparas/i.test(it.what+" "+(it.what_es||""));
const ev={d:today(),type:med?"treatment":"obs",note:`Done: ${it.what}${d!==today()?` (was due ${d})`:""}`,note_es:`Hecho: ${it.what_es||it.what}${d!==today()?` (tocaba el ${d})`:""}`,...evMeta(a,{via:"due",instructedBy:it.by||"schedule"})};

if(hasAnimal && !people.length && !all){ if(r.due_date) acts.push({type:"care",animal_id:r.animal_id,date:r.due_date,what_en:r.due_what_en,what_es:r.due_what_es}); else acts.push({type:"log",animal_id:r.animal_id,entry:r.type,note_en:p,note_es:p,weight_lb:r.weight_lb}); continue; }
const isTask=/\b(task|tarea|assign|asigna|needs? to|has to|must|clean|limpia|fix|arregla|repair|feed|alimenta|check|revisa|move|mueve|bring|trae|pick up|recoge|build|paint|pinta)\b/.test(low);
const to=all?"all":(people.length?people:"all");
if(isTask && to!=="all" ){ to.forEach(id=>acts.push({type:"task",assignee:id,title_en:p,title_es:p,date,priority:prio})); }
else acts.push({type:"directive",to,text_en:p,text_es:p,priority:prio,date});
}
return {actions:acts};
}

async function parseVoice(said,animal){

return S.sample.json(`A farm worker spoke this to log something about ${animal?`animal ${animal.tag} ${animal.name||""} (${animal.species})`:"an animal"}. It may be in English or Spanish.
Today is ${today()}. Words said: """${said}"""${roster}
Reply with only a JSON object:
{"animal_id": ${animal?`"${animal.id}"`:'the id from the list whose tag or name was said, or null if none matches'},
"heard_tag": the tag number or name the person said (string, or ""),
"type": one of "health","treatment","feed","movement","breeding","obs",
"note_en": a short clean record note in English, "note_es": the same note in Spanish,
"weight_lb": number or null, "eggs": number or null,
"due_date": "YYYY-MM-DD" if something is scheduled for a future date (pick the next upcoming date if no year was said), else null,
"due_what_en": short name of what is due in English (e.g. "Vaccination"), "due_what_es": the same in Spanish}
Use "treatment" for vaccines or medicine already given, "health" for symptoms, "obs" otherwise. A future vaccination is a scheduled item, not a treatment given.`,{modelTier:"quick",cache:false});
}

function startMic(targetId,btn){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const box=document.getElementById(targetId);
const hint=()=>{ toast(T2("Use the microphone key on your phone keyboard to dictate.","Use la tecla de micrófono del teclado para dictar.")); box?.focus(); };
if(!SR) return hint();
if(rec){ try{rec.stop();}catch{} return; }
try{ rec=new SR(); }catch{ return hint(); }
rec.lang = lang==="es"?"es-PR":"en-US"; rec.interimResults=true; rec.continuous=false;
const base=box.value?box.value.trim()+" ":""; btn.classList.add("live");
rec.onresult=e=>{ let txt=""; for(const r of e.results) txt+=r[0].transcript; box.value=base+txt; };
rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture") hint(); };
rec.onend=()=>{ btn.classList.remove("live"); rec=null; if(!box.value.trim()) return; if(targetId==="askIn") ask(box.value); else if(targetId==="cmd-in") cmdParse(); else btn.closest("form")?.querySelector("[data-fill]")?.click(); };
try{ rec.start(); }catch{ btn.classList.remove("live"); rec=null; hint(); }
}

function stepDone(s,step){ const ob=s.ob||{}; if(step==="welcome") return !!ob.welcome; if(step==="profile") return !!ob.profile; if(step==="legal") return !!(s.legal&&s.legal.done); if(step==="pin") return !!s.pinHash; if(step==="values") return !!(ob.values&&ob.values.date);

if(dueDate){ const [en,es]=pair(dueWhat||T2("Follow-up","Seguimiento"),dueAlt||(dueWhat?"":T2("Seguimiento","Follow-up"))); o.due={d:dueDate,what:en,what_es:es}; }
if(num){ if(a.species==="chicken"&&a.kind==="group") o.eggs=Number(num); else o.lb=Number(num); }
if(!note&&!num&&!dueDate&&photoIds.length){ o.note=`Photo record (${photoIds.length})`; o.note_es=`Registro con foto (${photoIds.length})`; }
await addEvent(a.id,o); toast(t("saved")); if(f.closest(".sheet")) closeSheet(); else { f.reset(); f.querySelectorAll(".ph-prev").forEach(b=>b.innerHTML=""); if(btn0){btn0.disabled=false;btn0.textContent=t("save");} } }
else if(f.id==="assignForm"){ const title=String(fd.get("title")||"").trim(); if(!title) return;
const area=String(fd.get("area")||"").trim(); const list=String(fd.get("checklist")||"").split("\n").map(s=>s.trim()).filter(Boolean).slice(0,12);
const btn=f.querySelector('button[type="submit"]'); if(btn){btn.disabled=true;btn.textContent=t("translating");}
const b=await bilingual([title,area,...list]);
await createTask({title:b.en[0],title_es:b.es[0],area:b.en[1],area_es:b.es[1],checklist:b.en.slice(2),checklist_es:b.es.slice(2),
assignee:fd.get("assignee"),date:fd.get("date"),priority:fd.get("priority"),animalId:fd.get("animalId"),recurring:!!fd.get("recurring")});
closeSheet(); toast(b.en[0]&&b.es[0]?t("autoTr"):t("saved")); }
else if(f.id==="animalForm"){ const tag=String(fd.get("tag")||"").trim(); if(!tag) return; const kind=fd.get("kind");
const btn=f.querySelector('button[type="submit"]'); if(btn){btn.disabled=true;btn.textContent=t("translating");}
const name=String(fd.get("name")||"").trim(), pen=String(fd.get("pen")||"").trim(), color=String(fd.get("color")||"").trim();
const b=await bilingual([pen,color]);
const doc={tag,name,species:fd.get("species"),kind,breed:String(fd.get("breed")||"").trim(),pen:b.en[0],pen_es:b.es[0],color:b.en[1],color_es:b.es[1],sex:fd.get("sex")||"",born:fd.get("born")||"",status:"Active",weights:[],events:[],due:[]};
if(kind==="group") doc.count=Number(fd.get("count")||0);
if(newPhoto){
if(S.assets){ try{ const up=await S.assets.upload(newPhoto.file); doc.photoId=up.id; }catch(e){ console.warn("upload",e&&e.code); } }
const ai=newPhoto.ai||{};
doc.events=[{d:today(),type:"obs",note:(STR.en.created+" "+(ai.summary_en||"")).trim(),note_es:(STR.es.created+" "+(ai.summary_es||"")).trim(),...evMeta(doc,{via:"photo",photoId:doc.photoId||""})}];
URL.revokeObjectURL(newPhoto.url); newPhoto=null;
}
await S.db.collection("animals").add(doc); closeSheet(); toast(t("saved")); }
}catch(err){ console.warn(err); toast(err&&err.code==="quota_exceeded"?t("storageFull"):t("saveErr")); }
});
document.addEventListener("keydown", e=>{ if(e.target.id==="askIn" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(e.target.value); } if(e.key==="Escape") closeSheet(); });
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{ if(S.view==="animals"&&S.animalId) drawCharts(); },150);});

// ---------- boot ----------
document.documentElement.lang=lang;
render();
const C = (window.claude&&window.claude.use) ? window.claude : demoClaude();
(async()=>{
let [db,sample,user,assets] = await Promise.all([C.use("db"),C.use("sample"),C.use("user"),C.use("assets")]);
// No shared database in this view (public link, phone browser, no permission): run as an on-device demo instead of a dead screen.
if(!db){ DEMO=true; db=makeLocalDB(); assets=localAssets; user=null; }
S.assets=assets;
S.db=db; S.sample=sample; S.ready=true;
if(user){ try{ const w=await user.can("data.write"); if(w===false) S.canWrite=false; }catch{} }
if(sample){ try{ const l=await sample.limits(); imgOK=!!l.images; if(!l.tools) S.sample=null; }catch{ imgOK=false; } }
if(!db){ render(); return; }
const bind=(col,key,sort)=>db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data())); if(sort) S[key].sort(sort); render(); },err=>console.warn(col,err));
db.doc("settings/handbook").onSnapshot(d=>{ handbook=d.exists?d.data():null; render(); },err=>console.warn("handbook",err));
db.collection("directives").onSnapshot(snap=>{ directives=snap.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },err=>console.warn("directives",err));
bind("animals","animals"); bind("tasks","tasks"); bind("staff","staff",(a,b)=>String(a.name).localeCompare(String(b.name)));
db.doc("settings/clock").onSnapshot(d=>{ clockCfg=d.exists?d.data():null; if(pendingClock&&pendingClock!=="ok"){ const c=pendingClock; pendingClock=null; setTimeout(()=>processClockCode(c),0); } render(); },err=>console.warn("clock",err));
bind("sales","sales");
db.collection("clock").onSnapshot(snap=>{ clockAll=snap.docs.map(d=>Object.assign({id:d.id},d.data())); if(S.view==="records") render(); },err=>console.warn("clockAll",err));
db.collection("clock").where("date","==",today()).onSnapshot(snap=>{ clocks=snap.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },err=>console.warn("clocks",err));
window.addEventListener("hashchange",()=>{ if(/^#clockin-/.test(location.hash)) setTimeout(handleClockHash,400); });
setTimeout(handleClockHash,1200);
// Deep link: #join opens the invite-code screen for new employees
if(location.hash==="#join"){ S.me=null; LS.set("sh.me",null); setTimeout(()=>{ render(); codeSheet(); },300); }
else if(/^#join-/.test(location.hash)) setTimeout(handleJoinHash,900);
render();
})();
})();
