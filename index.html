<style>
/* Layout: app shell — left rail on desktop, bottom tab bar on phones; ear-tag chips identify every animal */
:root{
/* Brand: Faith Based Family Farms Foundation, from the egg carton: forest green, leaf green, harvest gold on kraft cream */
--bg:#EAE0C8; --surface:#FBF5E6; --sunk:#E6DCC4; --line:#D3C39C;
--card:linear-gradient(180deg,#F7EEDA 0%,#EFE3C6 100%); --card-kpi:linear-gradient(155deg,#E5EDD3 0%,#D3E0BC 100%); --card-row:#FBF5E6; --card-glow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 18px -10px rgba(23,61,34,.35);

--hay:#C9A23F; --hay-ink:#2A1F05; --ok:#3F7D2A; --warn:#A87418; --crit:#A8382B;
--ok-bg:#E4EFD8; --warn-bg:#F6EBCF; --crit-bg:#F5DFD8;
--rail:#173D22; --rail-ink:#F7F1E1; --rail-gold:#D4AF4F;
--f-display:"Cinzel","Trajan Pro",Georgia,serif;
--f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;

--bg-art:radial-gradient(900px 520px at 100% -10%,rgba(201,162,63,.22),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(76,138,46,.16),transparent 60%),repeating-linear-gradient(135deg,rgba(95,102,80,.045) 0 2px,transparent 2px 14px);
--r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0F1A12; --surface:#16241A; --sunk:#0B140D; --line:#2A3B2C;
--fg:#EEE8D6; --muted:#A9AE96; --pasture:#6FAE4C; --pasture-ink:#0C160E; --leaf:#86BF5E;
--hay:#D9B65A; --hay-ink:#241A04; --ok:#7CC25A; --warn:#E0A945; --crit:#EE7E6C;
--ok-bg:#1A3218; --warn-bg:#33280F; --crit-bg:#3A1C16;
--rail:#0A140C; --rail-ink:#EEE8D6; --rail-gold:#D9B65A; color-scheme:dark; --card:var(--surface); --card-kpi:linear-gradient(155deg,#1B2C1F 0%,#16241A 100%); --card-row:#1A2A1E; --card-glow:0 6px 18px -12px rgba(0,0,0,.6); --bg-art:radial-gradient(900px 520px at 100% -10%,rgba(217,182,90,.14),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(111,174,76,.12),transparent 60%),radial-gradient(1px 1px at 20% 30%,rgba(238,232,214,.35),transparent 1.5px),radial-gradient(1px 1px at 70% 12%,rgba(238,232,214,.3),transparent 1.5px),radial-gradient(1px 1px at 45% 8%,rgba(238,232,214,.25),transparent 1.5px),repeating-linear-gradient(135deg,rgba(238,232,214,.025) 0 2px,transparent 2px 14px);}}
:root[data-theme="dark"]{
--bg:#0F1A12; --surface:#16241A; --sunk:#0B140D; --line:#2A3B2C;

--hay:#D9B65A; --hay-ink:#241A04; --ok:#7CC25A; --warn:#E0A945; --crit:#EE7E6C;
--ok-bg:#1A3218; --warn-bg:#33280F; --crit-bg:#3A1C16;
--rail:#0A140C; --rail-ink:#EEE8D6; --rail-gold:#D9B65A; color-scheme:dark; --card:var(--surface); --card-kpi:linear-gradient(155deg,#1B2C1F 0%,#16241A 100%); --card-row:#1A2A1E; --card-glow:0 6px 18px -12px rgba(0,0,0,.6); --bg-art:radial-gradient(900px 520px at 100% -10%,rgba(217,182,90,.14),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(111,174,76,.12),transparent 60%),radial-gradient(1px 1px at 20% 30%,rgba(238,232,214,.35),transparent 1.5px),radial-gradient(1px 1px at 70% 12%,rgba(238,232,214,.3),transparent 1.5px),radial-gradient(1px 1px at 45% 8%,rgba(238,232,214,.25),transparent 1.5px),repeating-linear-gradient(135deg,rgba(238,232,214,.025) 0 2px,transparent 2px 14px);}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:var(--bg-art);background-attachment:fixed;color:var(--fg);transition:background-color .25s,color .25s;font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hay);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);background-image:radial-gradient(120% 60% at 50% 0%,rgba(212,175,79,.16),transparent 60%);color:var(--rail-ink);border-right:3px solid var(--rail-gold);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em;line-height:1.15;color:var(--rail-ink)}
.brand img{width:132px;height:auto;border-radius:50%;aspect-ratio:1;object-fit:cover;border:3px solid var(--rail-gold);box-shadow:0 0 0 2px var(--rail)}
.brand .tagline{font-family:var(--f-display);font-size:11px;letter-spacing:.18em;color:var(--rail-gold);border-top:1px solid rgba(212,175,79,.5);border-bottom:1px solid rgba(212,175,79,.5);padding:3px 8px}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;opacity:.75;letter-spacing:.12em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:inherit;font-weight:600;display:flex;align-items:center;gap:10px;opacity:.85}
.nav button svg{width:18px;height:18px;flex:none}
.nav button[aria-current="page"]{background:rgba(255,255,255,.16);opacity:1}
:root[data-theme="dark"] .nav button[aria-current="page"]{background:rgba(0,0,0,.18)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
.main{min-width:0;padding-block:20px 96px;padding-inline:clamp(16px,3vw,36px)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:18px}
.topbar h1{font-family:var(--f-display);font-weight:700;color:var(--pasture);letter-spacing:.01em;font-size:30px;margin:0;line-height:1;text-wrap:balance}
.topbar .sub{color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg.theme button{padding:6px 10px;display:inline-flex;align-items:center} .seg.theme svg{width:16px;height:16px}
:root[data-theme="light"]{color-scheme:light}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--hay);color:var(--hay-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.demo{background:var(--warn-bg);color:var(--fg);border:1px dashed var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--pasture);box-shadow:var(--card-glow);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;color:var(--pasture);font-size:18px;padding-bottom:8px;border-bottom:2px solid var(--hay);margin:0 0 12px;letter-spacing:.01em}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card-kpi);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-family:var(--f-display);color:var(--pasture);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi.crit b{color:var(--crit)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.mute{background:var(--sunk);color:var(--muted)}
/* Ear tag chip: the farm's real identifier */
.tag{display:inline-grid;place-items:center;min-width:46px;height:30px;padding:0 8px;background:var(--hay);color:var(--hay-ink);font-family:var(--f-mono);font-weight:700;font-size:13px;border-radius:6px 6px 12px 12px;position:relative;flex:none}
.tag::before{content:"";position:absolute;top:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:rgba(0,0,0,.35)}
.tag span{padding-top:6px}
.tag.group{background:var(--sunk);color:var(--fg);border:1px dashed var(--muted)}
.tag.group::before{background:var(--muted)}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.task.done{opacity:.6}
.task.done .t-title{text-decoration:line-through}
.check{appearance:none;width:24px;height:24px;border:2px solid var(--pasture);border-radius:6px;flex:none;display:grid;place-items:center;margin:0;background:var(--surface);cursor:pointer}
.check:checked{background:var(--pasture)}
.check:checked::after{content:"";width:6px;height:12px;border:solid var(--pasture-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.sm{width:18px;height:18px;border-radius:4px}
.check.sm:checked::after{width:4px;height:9px;border-width:0 2px 2px 0}
.t-title{font-weight:600}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;color:var(--muted);font-size:13px;align-items:center}
.sub-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.sub-list label{display:flex;gap:8px;align-items:center;font-size:14px}
.prio-high{border-left:4px solid var(--crit)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--pasture);color:var(--pasture-ink);border-color:var(--pasture)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--pasture);color:var(--pasture-ink);border-color:var(--pasture)}
.animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.acard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%}
.acard:hover{border-color:var(--pasture)}
.acard .nm{font-weight:700}
.acard .meta{color:var(--muted);font-size:13px}
.profile-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.profile-head .tag{height:44px;min-width:64px;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px}
.facts div b{display:block;font-weight:600}
.spark{width:100%;height:120px;display:block}
.timeline .row .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:84px;flex:none;padding-top:2px}
form.stack{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%}
.inline{display:flex;gap:10px;flex-wrap:wrap}
.inline>.field{flex:1 1 140px}
/* Agent */
.agent{display:grid;grid-template-rows:1fr auto;height:calc(100vh - 150px);min-height:440px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.msgs{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(640px,92%);padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--pasture);color:var(--pasture-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg img{display:block;max-width:220px;border-radius:8px;margin-bottom:6px}
.receipt{align-self:flex-start;font-size:13px;display:flex;gap:6px;align-items:center;color:var(--ok);font-weight:600}
.receipt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.composer .bar{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;max-height:140px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.attach{display:flex;gap:8px;align-items:center;font-size:13px}
.attach img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.login{max-width:520px;margin:6vh auto 0}
.login-hero{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.login-hero img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--hay)}
.login-name{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--pasture);line-height:1.1}
.login-tag{font-family:var(--f-display);font-size:12px;letter-spacing:.18em;color:var(--warn);text-transform:uppercase;margin-top:4px}
.login .who-btn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-weight:600}
.login .who-btn:hover{border-color:var(--pasture)}
.bar-track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--pasture)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:12px;padding:18px;width:min(560px,100%);max-height:90vh;overflow-y:auto}
.photo-drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border:2px dashed var(--pasture);border-radius:12px;background:var(--bg);cursor:pointer;text-align:center;margin:12px 0}
.photo-drop svg{width:40px;height:40px;color:var(--pasture)}
.preview{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--sunk);border-radius:10px}
.preview img{width:96px;height:96px;object-fit:cover;border-radius:8px;flex:none}
.aphoto{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none}
.athumb{width:46px;height:46px;object-fit:cover;border-radius:8px;flex:none}
.ob-wrap{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.ob-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:st}
.ob-steps li{counter-increment:st;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
.ob-steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.ob-steps li.ok{color:var(--fg)} .ob-steps li.ok::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ob-steps li.cur{background:var(--surface);color:var(--fg);border:1px solid var(--line)} .ob-steps li.cur::before{border-color:var(--pasture)}
.ob-body{max-width:68ch} .ob-body h2{font-size:26px} .ob-body p{margin:0 0 10px}
.values,.lesson{margin:0 0 8px;padding-left:22px;display:flex;flex-direction:column;gap:8px}
fieldset.q{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0;display:flex;flex-direction:column;gap:6px}
fieldset.q legend{font-weight:600;padding:0 4px} fieldset.q label{display:flex;gap:8px;align-items:center}
fieldset.q.good{border-color:var(--ok)} fieldset.q.bad{border-color:var(--crit);background:var(--crit-bg)}
.chips label.chip{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.code-big{font-family:var(--f-mono);font-weight:700;font-size:44px;letter-spacing:.25em;text-align:center;background:var(--hay);color:var(--hay-ink);border-radius:12px;padding:12px;margin:10px 0 14px}
.lock{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn);font-weight:600}
@media (max-width:820px){.ob-wrap{grid-template-columns:1fr}.ob-steps{flex-direction:row;overflow-x:auto}.ob-steps li{white-space:nowrap}}
.voice{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--sunk);border:1px dashed var(--pasture)}
.voice .bar{display:flex;gap:8px;align-items:flex-start}
.voicebox{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:52px;resize:vertical}
.iconbtn.mic{background:var(--pasture);color:var(--pasture-ink);border-color:var(--pasture)}
.iconbtn.mic.live{background:var(--crit);border-color:var(--crit);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.btn.voicebtn{display:inline-flex;gap:6px;align-items:center;background:var(--hay);color:var(--hay-ink);border-color:var(--hay)}
.btn.voicebtn svg{width:16px;height:16px}
.rowlink{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;cursor:pointer;border-radius:8px;padding-inline:6px;align-items:center}
.rowlink:first-child{border-top:0} .rowlink:hover{background:var(--sunk)} .rowlink .chev{font-size:22px;color:var(--muted);line-height:1}
.duerow.hl{background:var(--warn-bg);border-radius:10px;padding-inline:10px;outline:2px solid var(--hay);animation:flash 1.2s 2}
@keyframes flash{50%{outline-color:transparent}}
.btn.sm{padding:5px 12px;font-size:13px}
.resched{position:relative;display:inline-flex;align-items:center;gap:6px} .resched input{border:0;background:none;font-size:13px;width:120px}
.dlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.drow{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.drow>div{min-width:0;overflow-wrap:anywhere}
.timeline .when{line-height:1.3}
.ph-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.ph-add{display:inline-flex;gap:6px;align-items:center} .btn.ph-add svg{width:16px;height:16px}
.ph-prev{display:flex;gap:6px;flex-wrap:wrap} .ph-prev img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:2px solid var(--hay)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px} .ph-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.phcount{display:inline-flex;gap:3px;align-items:center;color:var(--warn);font-weight:600} .phcount svg{width:13px;height:13px}
.stamp{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;color:var(--ok);font-family:var(--f-mono)}
.clockcard{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);margin-bottom:16px;border:2px solid var(--hay);flex-wrap:wrap}
.clockcard.off{background:var(--warn-bg)} .clockcard.on{background:var(--ok-bg);border-color:var(--ok)}
.clock-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--pasture);color:var(--pasture-ink);font-size:22px;font-weight:700;flex:none}
.clock-ic svg{width:26px;height:26px}
.kiosk{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.kiosk-brand{font-family:var(--f-display);font-weight:800;color:var(--pasture);font-size:20px}
.kiosk-title{font-family:var(--f-display);font-size:28px;font-weight:700}
.qrbox{background:#FFFDF8;padding:16px;border-radius:14px;border:4px solid var(--hay);min-width:292px;min-height:292px;display:grid;place-items:center}
.btn.primary svg{vertical-align:-3px}
.dircard{border:2px solid var(--hay);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.dir-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--pasture)} .dir-h svg{width:20px;height:20px}
.dir{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;background:var(--sunk);flex-wrap:wrap} .dir.high{background:var(--crit-bg);border-left:4px solid var(--crit)}
.plan{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer} .plan.high{border-left:4px solid var(--crit)}
.plan-ic svg{width:20px;height:20px;color:var(--pasture)}
.cmd .chips .chip{text-align:left;font-weight:500}
.nav button svg{flex:none}
.sheet h2{font-family:var(--f-display);color:var(--pasture);margin:0 0 12px;font-size:22px}
@media (max-width:820px){
.app{grid-template-columns:1fr}
.rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.brand,.rail-foot{display:none}
.nav{flex-direction:row;width:100%;justify-content:space-around}
.nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px}
.topbar h1{font-size:28px}
.agent{height:calc(100vh - 210px)}
}
:root:not([data-theme]) .nav button[aria-current="page"],.nav button[aria-current="page"]{background:rgba(212,175,79,.18);box-shadow:inset 3px 0 0 var(--rail-gold)}
.kpi,.task,.acard{box-shadow:var(--card-glow)}
.panel .task,.panel .acard,.panel .who-btn{background:var(--card-row)}
.kpi{border-top:3px solid var(--hay)}
.rec-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.rec-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec-filters input,.rec-filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-width:0}
.rec-filters input{width:min(240px,100%)}
.sheetwrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.sheet-t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.sheet-t th{position:sticky;top:0;z-index:1;background:var(--rail);color:var(--rail-ink);text-align:left;font-weight:700;padding:8px 10px;white-space:nowrap;cursor:pointer;border-bottom:2px solid var(--rail-gold);user-select:none}
.sheet-t th:hover{color:var(--rail-gold)}
.sheet-t td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 55%,transparent);white-space:nowrap;vertical-align:top}
.sheet-t td.wide{white-space:normal;min-width:240px;max-width:420px}
.sheet-t td.mono{font-family:var(--f-mono);font-weight:700}
.sheet-t .num{text-align:right}
.sheet-t .rn{color:var(--muted);text-align:right;width:1%;background:var(--sunk);font-size:11px}
.sheet-t tbody tr:nth-child(even) td:not(.rn){background:color-mix(in srgb,var(--pasture) 5%,transparent)}
.sheet-t tbody tr:hover td:not(.rn){background:color-mix(in srgb,var(--hay) 16%,transparent)}
.sheet-t tfoot td{position:sticky;bottom:0;background:var(--sunk);font-weight:700;border-top:2px solid var(--hay)}
.sheet-t .empty{text-align:center;color:var(--muted);padding:24px;white-space:normal}

.btn.primary{background:var(--pasture);border-color:var(--pasture);color:var(--pasture-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.btn{border-radius:999px}
.bar-fill{background:linear-gradient(90deg,var(--pasture),var(--leaf))}
.avatar{border:2px solid var(--hay);background:var(--pasture);color:var(--pasture-ink)}
.tag{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.topbar{padding-bottom:14px;border-bottom:2px solid var(--hay)}
@media (max-width:820px){.rail{border-right:0;border-top:3px solid var(--rail-gold)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function writeDoc(col,id,fn){ // one write at a time per doc
const key=col+"/"+id; const prev=queues[key]||Promise.resolve();
const next=prev.then(fn).catch(e=>{ console.warn(e); if(e&&e.code==="invalid_argument"){S.canWrite=false;render();} throw e; });
queues[key]=next.catch(()=>{}); return next;
}
function taskDoneToday(tk){ return tk.recurring ? !!(tk.doneOn&&tk.doneOn[today()]) : !!tk.done; }
function taskStamp(tk){ const d=tk.recurring?(tk.doneOn&&tk.doneOn[today()]):(tk.done?{by:tk.doneBy,ts:tk.doneAt}:null); return d&&d.ts?`${d.by||""} · ${fmtTime(d.ts)}`:(d&&d.by?d.by:""); }
function checkStamp(tk,i){ const raw=(tk.recurring?(tk.checks&&tk.checks[today()]):tk.checksOnce)||[]; const c=raw[i]; return c&&c.ts?`${c.by||""} · ${fmtTime(c.ts)}`:""; }
function taskChecks(tk){ const n=(tk.checklist||[]).length; const c = tk.recurring ? (tk.checks&&tk.checks[today()]) : tk.checksOnce; return Array.from({length:n},(_,i)=>!!(c&&c[i])); }
function tasksToday(){ const d=today(); return S.tasks.filter(tk=>tk.recurring || tk.date===d || (!tk.done && tk.date && tk.date<d)); }
function careItems(){ // due & overdue across animals
const d=today(); const out=[];
for(const a of S.animals) for(const it of (a.due||[])){ const n=daysBetween(d,it.d); if(n<=14) out.push({a,it,n}); }
return out.sort((x,y)=>x.n-y.n);
}
function recentEvents(days,types){ const d=today(); const out=[];
for(const a of S.animals) for(const e of (a.events||[])) if(daysBetween(e.d,d)<=days && (!types||types.includes(e.type))) out.push({a,e});
return out.sort((x,y)=>y.e.d.localeCompare(x.e.d)); }
function dueText(n){ const d=k=>Math.abs(k)===1?T2("day","día"):t("days"); return n<0 ? `${-n} ${d(n)} ${t("overdueBy")}` : n===0 ? t("dueToday") : `${t("in")} ${n} ${d(n)}`; }

// Translate short record text into the other language so every entry reads in English and Spanish.
async function bilingual(texts){
const cur=lang, blank=texts.map(()=>"");
const fallback = cur==="es"?{en:blank,es:texts}:{en:texts,es:blank};
if(!S.sample || !texts.some(x=>x)) return fallback;
try{
const out=await S.sample.json(`Translate each item from ${cur==="es"?"Spanish to English":"English to Spanish (Puerto Rico)"} for farm staff records. Keep numbers, ear tag IDs, animal names and units unchanged. Empty strings stay empty. Reply with only a JSON array of strings in the same order and length.\n\n${JSON.stringify(texts)}`,{modelTier:"quick"});
if(Array.isArray(out)&&out.length===texts.length){ const tr=out.map(x=>String(x??"")); return cur==="es"?{en:tr,es:texts}:{en:texts,es:tr}; }
}catch(e){ console.warn("translate",e&&e.code); }
return fallback;
}

via:S.busy?"agent":"form",instructedBy:"self",pen:a?(a.pen||""):"",pen_es:a?(a.pen_es||""):""},extra||{}); }
async function addEvent(animalId,{type,note,note_es,lb,eggs,pen,due,meta}){
const a=S.animals.find(x=>x.id===animalId); if(!a) throw new Error("Animal not found: "+animalId);
if(S.busy && S.agentPhoto && !(meta&&meta.photoIds&&meta.photoIds.length)){
if(!S.agentPhotoId && S.assets){ try{ S.agentPhotoId=(await S.assets.upload(S.agentPhoto)).id; }catch(e){ console.warn("agent photo",e&&e.code); } }
if(S.agentPhotoId) meta=Object.assign({},meta,{photoIds:[S.agentPhotoId]}); }
const ev=Object.assign({d:today(),type,note:note||"",note_es:note_es||""},evMeta(a,meta));
const patch={};
if(lb!=null){ const w=(a.weights||[]).concat([{d:today(),lb:Number(lb)}]).slice(-60); patch.weights=w; if(!ev.note&&!ev.note_es){ ev.note=`${lb} lb`; ev.note_es=`${lb} lb`; } }
if(eggs!=null){ const p=(a.production||[]).filter(x=>x.d!==today()).concat([{d:today(),eggs:Number(eggs)}]).slice(-60); patch.production=p; if(!ev.note&&!ev.note_es){ ev.note=`${eggs} eggs`; ev.note_es=`${eggs} huevos`; } }
if(pen){ ev.note = `${a.pen||a.pen_es||"?"} → ${pen}${note?". "+note:""}`; ev.note_es = `${a.pen_es||a.pen||"?"} → ${pen}${note_es?". "+note_es:""}`; patch.pen=pen; patch.pen_es=""; }
if(due&&due.d){ patch.due=(a.due||[]).filter(x=>!(x.d===due.d&&x.what===due.what)).concat([{d:due.d,what:due.what||"",what_es:due.what_es||"",by:meObj()?.name||""}]).slice(-40);
if(!ev.note&&!ev.note_es){ ev.note=`Scheduled: ${due.what||due.what_es} on ${due.d}`; ev.note_es=`Programado: ${due.what_es||due.what} el ${due.d}`; } }
patch.events=[ev].concat(a.events||[]).slice(0,120);
await writeDoc("animals",a.id,()=>S.db.collection("animals").doc(a.id).update(patch));
return ev;
}
async function createTask(data){
const doc={title:data.title||"",title_es:data.title_es||"",assignee:data.assignee||"",area:data.area||"",area_es:data.area_es||"",priority:data.priority||"normal",
checklist:data.checklist||[],checklist_es:data.checklist_es||[],animalId:data.animalId||"",createdBy:meObj()?.name||"",createdAt:today()};
if(data.recurring){doc.recurring=true;doc.doneOn={};doc.checks={};} else {doc.date=data.date||today();doc.done=false;doc.checksOnce=[];}
const ref=await S.db.collection("tasks").add(doc); return ref.id;
}
async function toggleTask(tk,val){
const by=meObj()?.name||"";
const ts=new Date().toISOString();
if(tk.recurring){ const doneOn=Object.assign({},tk.doneOn||{}); if(val) doneOn[today()]={by,ts,byId:meObj()?.id||""}; else delete doneOn[today()];
// keep only last 30 days
for(const k of Object.keys(doneOn)) if(daysBetween(k,today())>30) delete doneOn[k];
await writeDoc("tasks",tk.id,()=>S.db.collection("tasks").doc(tk.id).update({doneOn}));
} else await writeDoc("tasks",tk.id,()=>S.db.collection("tasks").doc(tk.id).update({done:val,doneBy:val?by:"",doneAt:val?ts:""}));
}
async function toggleCheck(tk,i,val){
const n=(tk.checklist||[]).length; const raw=(tk.recurring?(tk.checks&&tk.checks[today()]):tk.checksOnce)||[];
const c=Array.from({length:n},(_,j)=>raw[j]||false); c[i]=val?{by:meObj()?.name||"",ts:new Date().toISOString()}:false;
if(tk.recurring){ const checks={}; checks[today()]=c; await writeDoc("tasks",tk.id,()=>S.db.collection("tasks").doc(tk.id).update({checks})); }
else await writeDoc("tasks",tk.id,()=>S.db.collection("tasks").doc(tk.id).update({checksOnce:c}));
}

function drawSpark(id,pts,unit){
const svg=document.getElementById(id); if(!svg||!pts.length) return;
const W=svg.clientWidth||320,H=120,p={l:44,r:12,t:12,b:22};
const ys=pts.map(x=>x.v); let lo=Math.min(...ys),hi=Math.max(...ys); if(lo===hi){lo-=1;hi+=1;} const pad=(hi-lo)*.1; lo-=pad; hi+=pad;
const X=i=>p.l+(pts.length===1?(W-p.l-p.r)/2:i*(W-p.l-p.r)/(pts.length-1)); const Y=v=>p.t+(1-(v-lo)/(hi-lo))*(H-p.t-p.b);
const line=pts.map((q,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(q.v).toFixed(1)}`).join("");
const area=line+`L${X(pts.length-1).toFixed(1)},${H-p.b}L${X(0).toFixed(1)},${H-p.b}Z`;
const ticks=[lo+pad,(lo+hi)/2,hi-pad];
const last=pts[pts.length-1];
svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
svg.innerHTML = ticks.map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${Math.round(v)}</text>`).join("")
+ `<path d="${area}" fill="var(--pasture)" fill-opacity=".12"/><path d="${line}" fill="none" stroke="var(--pasture)" stroke-width="2.5" stroke-linejoin="round"/>`
+ `<circle cx="${X(pts.length-1)}" cy="${Y(last.v)}" r="4.5" fill="var(--hay)" stroke="var(--surface)" stroke-width="2"/>`
+ `<text x="${p.l}" y="${H-5}" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${esc(pts[0].d)}</text><text x="${W-p.r}" y="${H-5}" text-anchor="end" font-size="11" fill="var(--fg)" font-family="var(--f-mono)" font-weight="700">${esc(last.d)} · ${last.v} ${unit}</text>`;
}

drawSpark("chartW",(a.weights||[]).map(w=>({d:w.d,v:w.lb})),t("lb")); drawSpark("chartP",(a.production||[]).map(w=>({d:w.d,v:w.eggs})),t("eggs")); }

function findAnimal(q){ q=String(q||"").toLowerCase().trim(); if(!q) return [];
const terms=q.split(/\s+/);
return S.animals.map(a=>{ const hay=[a.tag,a.name,a.name_es,a.species,STR.en[a.species],STR.es[a.species],a.breed,a.pen,a.pen_es,a.color,a.color_es,a.sex,VOCAB[a.sex]].join(" ").toLowerCase();
let s=0; for(const w of terms){ if(String(a.tag).toLowerCase()===w) s+=5; else if(hay.includes(w)) s+=1; } return {a,s}; })
.filter(x=>x.s>0).sort((x,y)=>y.s-x.s).slice(0,6).map(x=>summary(x.a)); }
function agentTools(){
const need=id=>{ const a=S.animals.find(x=>x.id===String(id)||String(x.tag)===String(id)); if(!a) throw new Error("No animal with id or tag "+id+". Use search_animals first."); return a; };
const needW=id=>{ const a=need(id); if(!canWork(a.species)) throw new Error("This employee has not passed the "+TRAIN[AREA_OF[a.species]].title[0]+" training yet, so they cannot change this record. Tell them to finish it or ask the administrator."); return a; };
const receipt=txt=>{ S.chat.push({kind:"receipt",text:txt}); };
const ro=()=>{ if(!S.canWrite) throw new Error("This user has view-only access and cannot change records."); };
return [
{name:"search_animals",description:"Find animal or flock records by ear tag number, name, species, breed, color or pen. Returns up to 6 matches with id, tag, name, species and last weight.",
inputSchema:{type:"object",properties:{query:{type:"string"}},required:["query"]},execute:i=>findAnimal(i.query)},
{name:"get_animal",description:"Get the full record for one animal or flock by id or tag: profile, weight or egg history, upcoming care items and the 15 most recent history entries.",
inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
execute:i=>{ const a=need(i.id); return Object.assign(summary(a),{born:a.born||"",dam:a.dam||"",weights:(a.weights||[]).slice(-12),production:(a.production||[]).slice(-14),due:a.due||[],events:(a.events||[]).slice(0,15)}); }},
{name:"log_entry",description:"Add a history entry to an animal or flock. type is one of health, treatment, feed, movement, breeding, obs. Use for observations, treatments given, feed changes.",
inputSchema:{type:"object",properties:{id:{type:"string"},type:{type:"string",enum:["health","treatment","feed","movement","breeding","obs"]},note_en:{type:"string",description:"The note in English"},note_es:{type:"string",description:"The same note in Spanish"}},required:["id","type","note_en","note_es"]},
execute:async i=>{ ro(); const a=needW(i.id); await addEvent(a.id,{type:String(i.type),note:String(i.note_en||i.note||""),note_es:String(i.note_es||"")}); receipt(`${t(i.type)} · ${animalLabel(a)}`); return "Logged."; }},
{name:"log_weight",description:"Record a weight in pounds for an individual animal.",
inputSchema:{type:"object",properties:{id:{type:"string"},lb:{type:"number"}},required:["id","lb"]},
execute:async i=>{ ro(); const a=needW(i.id); const lb=Number(i.lb); if(!(lb>0)) throw new Error("Weight must be a positive number of pounds."); await addEvent(a.id,{type:"obs",lb}); receipt(`${t("weight")} ${lb} ${t("lb")} · ${animalLabel(a)}`); return "Weight saved."; }},
{name:"log_eggs",description:"Record today's egg count for a laying flock.",

function instructions(){
const herd=S.animals.map(a=>`${a.tag}${a.name?" "+a.name:""} (${a.species}${a.kind==="group"?", flock of "+(a.count||0):""}, ${a.breed||""}, pen ${a.pen||"?"}${a.color?", "+a.color:""})`).join("; ");
return `You are Shepherd, the animal-care agent inside the operating system of Faith Based Family Farms (chickens, cattle, pigs, horses, sheep).
Today is ${today()}. You are talking with ${meObj()?.name} (${meObj()?.role}). Reply in ${lang==="es"?"Spanish (Puerto Rico)":"English"}. Be brief and practical: short sentences, no markdown headers, no tables.
Staff (id: name, role): ${S.staff.map(s=>`${s.id}: ${s.name}, ${s.role}`).join("; ")}.
Animals on file: ${herd}.
Rules:
1. Identity: never write to a record unless you are sure which animal it is. If a request or photo matches more than one record, list the likely matches (tag and name) and ask which one. With a photo, read any visible ear tag first, then use species, color and markings, and state your confidence as a percentage. If confidence is under 90%, ask the person to confirm before logging anything.
2. Health: describe what you can see or what was reported and flag concerns, but never diagnose and never prescribe drugs or doses. When something looks wrong, suggest a vet check and offer to create a high-priority task.
3. Actions: use the tools to read and write records. After a write, confirm in one line what you saved. Ask a short clarifying question when the person's intent is unclear (for example: log a health note, create a vet task, or both?).
4. Chickens and pigs are often tracked as flocks or groups; log to the group record.
5. When someone says an animal needs something on a future date, call schedule_care with that date (next upcoming date if no year). If the tag they said is not on file, say so and list close matches; never create a record for a tag that does not exist.
6. Staff read records in English and Spanish. Every note and task you save must be written in both languages (the _en and _es fields), whichever language the person used.`;
}
async function ask(text){
if(S.busy||!S.sample) return; text=String(text||"").trim(); const photo=S.photo;
if(!text && !photo) return;
const shown = text || t("whichAnimal");
S.chat.push({role:"user",text:shown,img:photo?photo.url:null});
const ai=document.getElementById("askIn"); if(ai) ai.value="";
S.agentPhoto=photo?photo.file:null; S.agentPhotoId=null;
S.photo=null; S.busy=true; S.streamText=""; S.ctl=new AbortController(); render();
const turns=[{role:"user",content:instructions()}].concat(S.chat.filter(m=>m.role).slice(-12).map(m=>({role:m.role,content:m.img?m.text+"\n[A photo was attached to this message.]":m.text})));
try{
const opts={signal:S.ctl.signal,tools:agentTools(),onText:({text})=>{S.streamText=text; const el=document.getElementById("streaming"); if(el) el.textContent=text; const m=document.getElementById("msgs"); if(m) m.scrollTop=m.scrollHeight;}};
if(photo) opts.images=[photo.file];
const res=await S.sample(turns,opts);
S.chat.push({role:"assistant",text:res.text+(res.truncated?" …":"")}); if(S.speak) sayAloud(res.text);
}catch(e){
const partial=e&&e.text; if(partial) S.chat.push({role:"assistant",text:partial});
const map={cancelled:"",not_granted:lang==="es"?"No se permitió usar Claude en esta página.":"Claude wasn't allowed on this page.",rate_limited:lang==="es"?"Demasiadas solicitudes. Intenta en un momento.":"Too many requests right now. Try again in a moment.",image_rejected:lang==="es"?"No pude leer esa foto. Prueba otra.":"That photo couldn't be read. Try a different one.",images_unavailable:lang==="es"?"Esta vista no puede enviar fotos.":"Photos can't be sent from this view.",tools_unavailable:lang==="es"?"Esta vista no permite que el agente cambie registros.":"This view can't let the agent change records."};
const msg = e&&e.code in map ? map[e.code] : (lang==="es"?"Algo falló. Intenta de nuevo.":"Something went wrong. Try again.");
if(msg) S.chat.push({kind:"receipt",text:msg});
if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)) S.sample=null;
}finally{ S.busy=false; S.ctl=null; S.streamText=""; render(); }
}

if(S.sample && imgOK){
try{

"species": one of "cow","horse","sheep","pig","chicken";
"kind": "group" if it shows a flock or pen of several animals of the same species, otherwise "individual";
"tag": the ear tag, leg band or brand number exactly as you can read it, or "" if none is clearly readable (never invent one);
"breed": your best breed guess in English, or "";
"sex": "Female","Male","Castrated male","Mixed" or "" if you cannot tell;
"color": short coat color and markings in English; "color_es": the same in Spanish;
"count": number of animals visible;
"confidence": 0-100, how sure you are of species and breed together;
"summary_en": one sentence on what you see, including any visible injury, limp posture or thin body condition as an observation only, never a diagnosis; "summary_es": the same sentence in Spanish.`,{images:[file]});

const med=/vaccin|booster|deworm|vacuna|desparas/i.test(it.what+" "+(it.what_es||""));
const ev={d:today(),type:med?"treatment":"obs",note:`Done: ${it.what}${d!==today()?` (was due ${d})`:""}`,note_es:`Hecho: ${it.what_es||it.what}${d!==today()?` (tocaba el ${d})`:""}`,...evMeta(a,{via:"due",instructedBy:it.by||"schedule"})};

if(m1) dd=mk(MON[m1[1]],+m1[2]); else if(m2) dd=mk(MON[m2[2]],+m2[1]); else if(m3) dd=mk(+m3[1]-1,+m3[2]); else if(/tomorrow|mañana/.test(txt)){ const d=new Date(); d.setDate(d.getDate()+1); dd=d.toLocaleDateString("en-CA"); }
const vac=/vaccin|vacun|booster|refuerzo/.test(txt), dew=/deworm|desparas/.test(txt), far=/farrier|herrador|hoof trim/.test(txt), preg=/pregnan|preñ/.test(txt);
if(dd){ r.due_date=dd; [r.due_what_en,r.due_what_es]=vac?["Vaccination","Vacunación"]:dew?["Deworming","Desparasitación"]:far?["Farrier visit","Visita del herrador"]:preg?["Pregnancy check","Chequeo de preñez"]:["Follow-up","Seguimiento"]; }
else if(vac||dew||/gave|given|treated|inject|shot|aplic|inyec/.test(txt)) r.type="treatment";
if(/limp|cojea|sick|enferm|weak|débil|wound|herida|swell|hincha|diarr|scour/.test(txt)) r.type="health";
const w=txt.match(/(\d+(?:\.\d+)?)\s*(lb|lbs|libras|pounds)/); if(w) r.weight_lb=+w[1];
const e=txt.match(/(\d+)\s*(eggs|huevos)/); if(e) r.eggs=+e[1];
return r;
}

async function codeFor(w){ return (await sha("clock:"+clockCfg.secret+":"+w)).slice(0,8); }
async function staticCode(){ return (await sha("clock:"+clockCfg.secret+":static")).slice(0,8); }
async function validCode(code){ if(!clockCfg||!clockCfg.secret) return false; if(clockCfg.mode==="static") return code===await staticCode();
const w=win(); for(let k=-3;k<=1;k++) if(code===await codeFor(w+k)) return true; return false; }
async function ensureClockCfg(){ if(clockCfg&&clockCfg.secret) return; const sec=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
await S.db.doc("settings/clock").set({secret:sec,mode:"rotating",createdBy:meObj()?.name||"",createdAt:new Date().toISOString()}); }

let pendingClock=null;
async function handleClockHash(){
const m=/^#clockin-([a-z0-9]{6,12})$/i.exec(location.hash||""); if(!m) return; const code=m[1].toLowerCase();
try{ history.replaceState(null,"",location.pathname+location.search); }catch{ location.hash=""; }
if(!clockCfg){ pendingClock=code; return; }
if(!(await validCode(code))){ toast(T2("This QR code has expired. Scan the code at the office again.","Este código QR expiró. Escanee de nuevo el código en la oficina.")); return; }

function staffMatch(word){ const w=word.toLowerCase(); return S.staff.find(s=>staffStatus(s)==="active"&&s.role!=="admin"&&s.name.toLowerCase().split(/\s+/).some(p=>p.length>2&&(p===w||p.normalize("NFD").replace(/[̀-ͯ]/g,"")===w.normalize("NFD").replace(/[̀-ͯ]/g,"")))); }
function localCommand(text){
const acts=[]; const parts=[]; for(const seg of text.split(/(?<=[.!?;])\s+|\n+/).map(s=>s.trim()).filter(Boolean)){ if(parts.length && seg.split(/\s+/).length<=2) parts[parts.length-1]+=" "+seg; else parts.push(seg); }
for(const p of parts){
const low=p.toLowerCase(); const words=low.replace(/[^\p{L}\p{N}\s-]/gu," ").split(/\s+/);
const people=[...new Set(words.map(staffMatch).filter(Boolean).map(s=>s.id))];
const all=/\b(everyone|everybody|all staff|all employees|team|todos|todo el mundo|equipo)\b/.test(low);
const r=localParse(p,null);
const hasAnimal=!!r.animal_id && /\b(cow|vaca|calf|ternero|horse|caballo|sheep|oveja|pig|cerdo|sow|cerda|hen|gallina|flock|lote|ram|carnero|\d{2,})\b/.test(low);
const prio=/\b(urgent|asap|priority|important|now|urgente|prioridad|importante|ya)\b/.test(low)?"high":"normal";
let date=r.due_date||today(); if(/\btomorrow|mañana\b/.test(low)){ const d=new Date(); d.setDate(d.getDate()+1); date=d.toLocaleDateString("en-CA"); }
if(/\bclock (in|me in)\b|marca(r)? (la )?entrada/.test(low) && people.length){ people.forEach(id=>acts.push({type:"clockin",staff_id:id})); continue; }
if(hasAnimal && !people.length && !all){ if(r.due_date) acts.push({type:"care",animal_id:r.animal_id,date:r.due_date,what_en:r.due_what_en,what_es:r.due_what_es}); else acts.push({type:"log",animal_id:r.animal_id,entry:r.type,note_en:p,note_es:p,weight_lb:r.weight_lb}); continue; }
const isTask=/\b(task|tarea|assign|asigna|needs? to|has to|must|clean|limpia|fix|arregla|repair|feed|alimenta|check|revisa|move|mueve|bring|trae|pick up|recoge|build|paint|pinta)\b/.test(low);
const to=all?"all":(people.length?people:"all");
if(isTask && to!=="all" ){ to.forEach(id=>acts.push({type:"task",assignee:id,title_en:p,title_es:p,date,priority:prio})); }
else acts.push({type:"directive",to,text_en:p,text_es:p,priority:prio,date});
}
return {actions:acts};
}

function updateRecTable(){ const el=document.getElementById("recTable"); if(el) el.innerHTML=recTableHTML(); }
document.addEventListener("click",e=>{ const el=e.target.closest("[data-rectab],[data-recrange],[data-recsort],[data-act=recCsv],[data-act=addSale]"); if(!el) return;
if(el.dataset.rectab){ REC.tab=el.dataset.rectab; LS.set("sh.rec.tab",REC.tab); render(); }
else if(el.dataset.recrange){ REC.range=el.dataset.recrange; LS.set("sh.rec.range",REC.range); render(); }
else if(el.dataset.recsort){ const k=el.dataset.recsort; const cur=REC.sort[REC.tab]||recFiltered().sort; REC.sort[REC.tab]={k,dir:cur.k===k?-cur.dir:(k==="ts"||k==="d"?-1:1)}; updateRecTable(); }
else if(el.dataset.act==="recCsv") recCsv();
else if(el.dataset.act==="addSale") saleSheet(); });
document.addEventListener("input",e=>{ if(e.target.id==="recQ"){ REC.q=e.target.value; updateRecTable(); } });
document.addEventListener("change",e=>{ if(e.target.id==="recWho"){ REC.who=e.target.value; updateRecTable(); } });
document.addEventListener("submit",async e=>{ if(e.target.id!=="saleForm") return; e.preventDefault(); const fd=new FormData(e.target); const me=meObj()||{};
const qty=Number(fd.get("qty")), price=Number(fd.get("price")); const item=String(fd.get("item")||"").trim(); const d=String(fd.get("d")||today());
const now=new Date(); const ts=d===today()?now.toISOString():new Date(d+"T12:00:00").toISOString();
try{ await S.db.collection("sales").add({d,ts,channel:String(fd.get("channel")),item,item_es:item,qty,unit:String(fd.get("unit")),price,total:Math.round(qty*price*100)/100,note:String(fd.get("note")||"").trim(),by:me.name||"",byId:me.id||""});
closeSheet(); toast(T2("Sale saved","Venta guardada")); }catch(err){ console.warn(err); toast(t("saveErr")); } });

async function parseVoice(said,animal){
if(!S.sample) return localParse(said,animal);
const roster = animal ? "" : "\nAnimals on file (id | tag | name | species): "+S.animals.map(a=>`${a.id} | ${a.tag} | ${L(a,"name")||""} | ${a.species}`).join("; ");
return S.sample.json(`A farm worker spoke this to log something about ${animal?`animal ${animal.tag} ${animal.name||""} (${animal.species})`:"an animal"}. It may be in English or Spanish.
Today is ${today()}. Words said: """${said}"""${roster}
Reply with only a JSON object:
{"animal_id": ${animal?`"${animal.id}"`:'the id from the list whose tag or name was said, or null if none matches'},
"heard_tag": the tag number or name the person said (string, or ""),
"type": one of "health","treatment","feed","movement","breeding","obs",
"note_en": a short clean record note in English, "note_es": the same note in Spanish,
"weight_lb": number or null, "eggs": number or null,
"due_date": "YYYY-MM-DD" if something is scheduled for a future date (pick the next upcoming date if no year was said), else null,
"due_what_en": short name of what is due in English (e.g. "Vaccination"), "due_what_es": the same in Spanish}
Use "treatment" for vaccines or medicine already given, "health" for symptoms, "obs" otherwise. A future vaccination is a scheduled item, not a treatment given.`,{modelTier:"quick",cache:false});
}
function voicePrefill(r){ const es=lang==="es";
return {type:r.type, num:r.weight_lb!=null?r.weight_lb:(r.eggs!=null?r.eggs:null),
note:es?(r.note_es||r.note_en):(r.note_en||r.note_es), noteAlt:es?(r.note_en||""):(r.note_es||""),
dueDate:r.due_date||"", dueWhat:es?(r.due_what_es||r.due_what_en||""):(r.due_what_en||r.due_what_es||""), dueAlt:es?(r.due_what_en||""):(r.due_what_es||"")}; }
let rec=null;
function sayAloud(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text).slice(0,1200)); u.lang=lang==="es"?"es-PR":"en-US";
const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang==="es"?"es":"en")); if(v) u.voice=v; speechSynthesis.speak(u); }catch{} }
function startMic(targetId,btn){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const box=document.getElementById(targetId);
const hint=()=>{ toast(T2("Use the microphone key on your phone keyboard to dictate.","Use la tecla de micrófono del teclado para dictar.")); box?.focus(); };
if(!SR) return hint();
if(rec){ try{rec.stop();}catch{} return; }
try{ rec=new SR(); }catch{ return hint(); }
rec.lang = lang==="es"?"es-PR":"en-US"; rec.interimResults=true; rec.continuous=false;
const base=box.value?box.value.trim()+" ":""; btn.classList.add("live");
rec.onresult=e=>{ let txt=""; for(const r of e.results) txt+=r[0].transcript; box.value=base+txt; };
rec.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture") hint(); };
rec.onend=()=>{ btn.classList.remove("live"); rec=null; if(!box.value.trim()) return; if(targetId==="askIn") ask(box.value); else if(targetId==="cmd-in") cmdParse(); else btn.closest("form")?.querySelector("[data-fill]")?.click(); };
try{ rec.start(); }catch{ btn.classList.remove("live"); rec=null; hint(); }
}
async function fillFromVoice(px){
const box=document.getElementById(px+"-voice"); const form=box.closest("form"); const said=box.value.trim(); if(!said) return;
const st=document.getElementById(px+"-vstat"); st.textContent=T2("Listening to what you said…","Procesando lo que dijo…");
const a=S.animals.find(x=>x.id===form.dataset.id);
try{ const r=await parseVoice(said,a); const pre=voicePrefill(r);
const set=(n,v)=>{ const el=form.elements[n]; if(el&&v!=null) el.value=v; };
set("type",pre.type); if(pre.num!=null) set("num",pre.num); set("note",pre.note); set("dueDate",pre.dueDate); set("dueWhat",pre.dueWhat); set("note_alt",pre.noteAlt); set("due_alt",pre.dueAlt);
st.textContent=T2("Filled in. Check the fields, then Save.","Listo. Revise los campos y guarde."); form.querySelector('button[type="submit"]')?.focus();
}catch(e){ st.textContent=T2("Couldn't understand that. Try again or type it in.","No se entendió. Intente de nuevo o escríbalo."); }
}
function voiceSheet(){
openSheet(`<h2>🎙 ${T2("Voice log","Registro por voz")}</h2>
<p class="t-meta">${T2('Say the animal and what happened. Example: "Cow 248 needs her vaccinations on November 17."','Diga el animal y lo que pasó. Ejemplo: "La vaca 248 necesita sus vacunas el 17 de noviembre."')}</p>
<div class="voice"><div class="bar"><textarea id="vs-voice" class="voicebox" rows="3"></textarea><button type="button" class="iconbtn mic" data-mic="vs-voice">${I.mic}</button></div>
<div class="inline"><button class="btn primary" type="button" data-act="voiceGo" ${S.sample||DEMO?"":"disabled"}>✨ ${T2("Find the animal and fill in","Buscar el animal y llenar")}</button><button class="btn" type="button" data-act="closeSheet">${t("cancel")}</button></div>
<div class="t-meta" id="vs-stat" aria-live="polite">${S.sample||DEMO?"":esc(t("noAgent"))}</div></div><div id="vs-out"></div>`);
setTimeout(()=>document.getElementById("vs-voice")?.focus(),50);
}
async function voiceGo(){
const said=document.getElementById("vs-voice").value.trim(); if(!said) return; const st=document.getElementById("vs-stat"), out=document.getElementById("vs-out");
st.textContent=T2("Finding the animal…","Buscando el animal…"); out.innerHTML="";
try{ const r=await parseVoice(said,null); const a=S.animals.find(x=>x.id===r.animal_id);
if(!a){ st.textContent=""; out.innerHTML=`<div class="demo" style="margin-top:12px">${T2("No animal on file matches","Ningún animal registrado coincide con")} <b>${esc(r.heard_tag||said)}</b>. ${T2("Pick one:","Elija uno:")}</div>
<div class="chips">${S.animals.filter(x=>canWork(x.species)).slice(0,30).map(x=>`<button class="chip" data-vpick="${esc(x.id)}">${esc(animalLabel(x))}</button>`).join("")}</div>`;
out.dataset.json=JSON.stringify(r); out.dataset.said=said; return; }
showVoiceForm(a,r,said);
}catch(e){ st.textContent=T2("Couldn't understand that. Try again.","No se entendió. Intente de nuevo."); }
}
function showVoiceForm(a,r,said){
const st=document.getElementById("vs-stat"), out=document.getElementById("vs-out");
if(!canWork(a.species)){ out.innerHTML=`<div class="lock" style="margin-top:12px">🔒 ${T2("Training needed for this animal.","Requiere entrenamiento para este animal.")}</div>`; return; }
st.textContent=T2("Filled in. Check the fields, then Save.","Listo. Revise los campos y guarde.");
const pre=Object.assign(voicePrefill(r),{said});
out.innerHTML=`<div class="profile-head" style="margin:14px 0 4px"><span class="tag ${a.kind==="group"?"group":""}"><span>${esc(a.tag)}</span></span><b>${esc(L(a,"name")||t(a.species))}</b></div>`+logFormHTML(a,pre,"vf");
}

case "toggleSpeak": S.speak=!S.speak; LS.set("sh.speak",S.speak); if(!S.speak) try{speechSynthesis.cancel();}catch{} else sayAloud(T2("Voice replies are on.","Respuestas en voz activadas.")); render(); break;
case "voiceGo": voiceGo(); break;
case "hire": hireSheet(); break;
case "handbook": handbookSheet(); break;
case "copyInvite": { const ta=document.getElementById("inv-msg"); const done=()=>toast(T2("Copied","Copiado")); try{ navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();}); }catch{ ta.select(); } break; }
case "obBack": { const me=meObj(); const st=obSteps(me); const i=st.indexOf(obStep); if(i>0){ obStep=st[i-1]; render(); window.scrollTo(0,0);} break; }
case "obWelcome": { const me=meObj(); saveStaff(me.id,{langPref:lang,ob:{welcome:today()}}).then(()=>{ obNext(me); render(); window.scrollTo(0,0); }).catch(()=>toast(t("saveErr"))); break; }
case "obFinish": { const me=meObj(); saveStaff(me.id,{status:"active",ob:{doneAt:today()}}).then(()=>{ obStep=null; S.view="today"; render(); }).catch(()=>toast(t("saveErr"))); break; }
case "clearPhoto": if(S.photo) URL.revokeObjectURL(S.photo.url); S.photo=null; render(); break;
}
});
document.addEventListener("change", async e=>{
const el=e.target;
if(el.dataset.plan!=null&&cmdPlan){ cmdPlan[Number(el.dataset.plan)]._off=!el.checked; const b=document.querySelector('[data-act="cmdRun"]'); if(b) b.textContent=T2("Send / execute","Enviar / ejecutar")+" ("+cmdPlan.filter(a=>!a._off).length+")"; return; }
if(el.dataset.phprev){ const box=document.getElementById(el.dataset.phprev); if(!box) return; box.innerHTML="";
const files=[...(el.files||[])].slice(0,4); for(const f of files){ const img=document.createElement("img"); img.src=URL.createObjectURL(f); img.alt=""; box.appendChild(img); }
if((el.files||[]).length>4) toast(T2("Only the first 4 photos will be saved.","Solo se guardarán las primeras 4 fotos.")); return; }
if(el.name==="instr"){ const v=el.closest("form")?.querySelector(".vetname"); if(v) v.hidden=el.value!=="vet"; return; }
if(el.dataset.resched){ const a=S.animals.find(x=>x.id===el.dataset.resched); if(!a||!el.value) return; const [d,...w]=el.dataset.key.split("|"); const what=w.join("|");
const due=(a.due||[]).map(x=>x.d===d&&x.what===what?Object.assign({},x,{d:el.value}):x);
const it=(a.due||[]).find(x=>x.d===d&&x.what===what)||{};
const ev={d:today(),type:"obs",note:`Rescheduled ${it.what||""}: ${d} → ${el.value}`,note_es:`Reprogramado ${it.what_es||it.what||""}: ${d} → ${el.value}`,...evMeta(a,{via:"due"})};
try{ await writeDoc("animals",a.id,()=>S.db.collection("animals").doc(a.id).update({due,events:[ev].concat(a.events||[]).slice(0,120)})); S.focusDue=el.value+"|"+what; toast(t("saved")); }catch{ toast(t("saveErr")); } return; }
if(el.dataset.task){ const tk=S.tasks.find(x=>x.id===el.dataset.task); if(tk){ try{await toggleTask(tk,el.checked);}catch{el.checked=!el.checked;} } }
else if(el.dataset.check){ const tk=S.tasks.find(x=>x.id===el.dataset.check); if(tk){ try{await toggleCheck(tk,Number(el.dataset.i),el.checked);}catch{el.checked=!el.checked;} } }
else if(el.id==="nf-photo" && el.files && el.files[0]){ readAnimalPhoto(el.files[0]); }
else if(el.id==="photoIn" && el.files && el.files[0]){ const f=el.files[0]; S.photo={file:f,url:URL.createObjectURL(f)}; const draft=document.getElementById("askIn")?.value||""; render(); const ai=document.getElementById("askIn"); if(ai){ai.value=draft;ai.focus();} }
});
document.addEventListener("submit", async e=>{
e.preventDefault(); const f=e.target; const fd=new FormData(f);
try{
if(f.id==="pinForm"){ const st=S.staff.find(x=>x.id===f.dataset.id); const pin=String(fd.get("pin")||""); const err=document.getElementById("pf-err");
if(!/^\d{4}$/.test(pin)){ err.textContent=T2("Enter 4 digits.","Ingrese 4 dígitos."); return; }
const wait=(pinFails[st.id]||{}).until||0; if(Date.now()<wait){ err.textContent=T2("Too many tries. Wait a minute.","Demasiados intentos. Espere un minuto."); return; }
const h=await pinHash(st.id,pin);
if(st.pinHash && st.pinHash!==h){ const pf=pinFails[st.id]=pinFails[st.id]||{n:0}; pf.n++; if(pf.n>=5){ pf.until=Date.now()+60000; pf.n=0; } err.textContent=T2("Wrong PIN.","PIN incorrecto."); f.reset(); return; }
if(!st.pinHash) await saveStaff(st.id,{pinHash:h});
S.me=st.id; LS.set("sh.me",S.me); S.view=st.role==="admin"?"dash":"today"; closeSheet(); render();
if(pendingClock==="ok"&&st.role!=="admin"){ pendingClock=null; doClockIn("qr").catch(()=>toast(t("saveErr"))); } }
else if(f.id==="codeForm"){ const code=String(fd.get("code")||"").trim(); const st=S.staff.find(x=>x.code===code && staffStatus(x)!=="active");
if(!st){ document.getElementById("cf-err").textContent=T2("That code isn't valid. Check it with the administrator.","Ese código no es válido. Verifíquelo con el administrador."); return; }
if(st.langPref){ lang=st.langPref; LS.set("sh.lang",lang); }
if(staffStatus(st)==="invited") await saveStaff(st.id,{status:"onboarding"});
S.me=st.id; LS.set("sh.me",S.me); obStep=null; closeSheet(); render(); }
else if(f.id==="obProfile"){ const me=meObj();
await saveStaff(me.id,{name:String(fd.get("name")).trim(),phone:String(fd.get("phone")).trim(),emergencyName:String(fd.get("ecName")).trim(),emergencyPhone:String(fd.get("ecPhone")).trim(),ob:{profile:today()}});
obNext(me); render(); window.scrollTo(0,0); }
else if(f.id==="obPin"){ const me=meObj(); const a=String(fd.get("pin")), b=String(fd.get("pin2"));
if(!/^\d{4}$/.test(a)){ document.getElementById("ob-pin-err").textContent=T2("The PIN must be 4 digits.","El PIN debe tener 4 dígitos."); return; }
if(a!==b){ document.getElementById("ob-pin-err").textContent=T2("The two PINs don't match.","Los dos PIN no coinciden."); return; }
if(/^(\d)\1{3}$/.test(a)||a==="1234"){ document.getElementById("ob-pin-err").textContent=T2("Pick a PIN that's harder to guess.","Elija un PIN más difícil de adivinar."); return; }
await saveStaff(me.id,{pinHash:await pinHash(me.id,a)}); obNext(me); render(); window.scrollTo(0,0); }
else if(f.id==="obValues"){ const me=meObj(); const sign=String(fd.get("sign")||"").trim(); if(!sign||!fd.get("agree")) return;
await saveStaff(me.id,{ob:{values:{name:sign,date:today(),lang}}}); obNext(me); render(); window.scrollTo(0,0); }
else if(f.id==="obQuiz"){ const me=meObj(); const k=f.dataset.k; const m=TRAIN[k]; const ans=m.quiz.map((q,i)=>Number(fd.get("q"+i)));
const wrong=m.quiz.map((q,i)=>ans[i]===q[2]?-1:i).filter(i=>i>=0); const prev=((me.ob||{}).train||{})[k]||{}; const attempts=(prev.attempts||0)+1;
quizState[k]={ans,checked:true,wrong};
const rec={attempts,score:m.quiz.length-wrong.length,date:today(),passed:wrong.length===0};
await saveStaff(me.id,{ob:{train:{[k]:rec}}});
if(rec.passed){ delete quizState[k]; obNext(me); toast(T2("Passed","Aprobado")); window.scrollTo(0,0); }
render(); }
else if(f.id==="hireForm"){ const name=String(fd.get("name")||"").trim(); if(!name) return; const areas=fd.getAll("areas").map(String);
const btn=f.querySelector('button[type="submit"]'); if(btn) btn.disabled=true;
let code; do{ code=String(Math.floor(100000+Math.random()*900000)); } while(S.staff.some(x=>x.code===code));
const start=String(fd.get("start")||today());
const doc={name,role:fd.get("role"),areas,startDate:start,langPref:fd.get("lang"),status:"invited",code,invitedBy:meObj()?.name||"",invitedAt:today(),ob:{train:{}}};
const ref=await S.db.collection("staff").add(doc);
await firstWeekTasks(ref.id,start,areas);
inviteSheet(Object.assign({id:ref.id},doc)); }
else if(f.id==="adminClockForm"){ const st=S.staff.find(x=>x.id===f.dataset.id); const [h,mi]=String(fd.get("time")).split(":").map(Number); const d=new Date(); d.setHours(h,mi,0,0);
await S.db.collection("clock").doc(clockId(st.id,today())).set({staffId:st.id,name:st.name,date:today(),in:d.toISOString(),out:"",method:"admin",note:String(fd.get("note")||"").trim(),enteredBy:meObj()?.name||"",enteredAt:new Date().toISOString(),shifts:[]});
closeSheet(); toast(t("saved")); }
else if(f.id==="handbookForm"){ await S.db.doc("settings/handbook").set({values_en:String(fd.get("en")||""),values_es:String(fd.get("es")||""),updatedBy:meObj()?.name||"",updatedAt:today()}); closeSheet(); toast(t("saved")); }
else if(f.id==="askForm"){ const v=document.getElementById("askIn").value; ask(v); }
else if(f.dataset.log==="1"){ const a=S.animals.find(x=>x.id===f.dataset.id); const num=fd.get("num"); const note=String(fd.get("note")||"").trim(); const type=fd.get("type");
const dueDate=String(fd.get("dueDate")||""), dueWhat=String(fd.get("dueWhat")||"").trim(); const noteAlt=String(fd.get("note_alt")||""), dueAlt=String(fd.get("due_alt")||"");
const btn0=f.querySelector('button[type="submit"]'); const hasPh=fd.getAll("photos").some(x=>x&&x.size>0);
if(!num && !note && !dueDate && !hasPh) return; if(btn0) btn0.disabled=true; const instr=String(fd.get("instr")||"self"); const said=String(f.querySelector(".voicebox")?.value||"").trim();
const photoIds=[]; const files=fd.getAll("photos").filter(x=>x&&x.size>0).slice(0,4);
if(files.length&&S.assets){ if(btn0) btn0.textContent=T2("Uploading photos…","Subiendo fotos…");
for(const file of files){ try{ const up=await S.assets.upload(file); photoIds.push(up.id); }catch(e){ console.warn("photo",e&&e.code); toast(T2("A photo couldn't be saved.","No se pudo guardar una foto.")); } } }
const o={type,meta:{photoIds,via:said?"voice":"form",instructedBy:instr==="vet"?("vet:"+String(fd.get("vetName")||"").trim()):instr,said}}; const btn=f.querySelector('button[type="submit"]'); if(btn) btn.disabled=true;
const need=[]; if(note&&!noteAlt) need.push(note); if(dueDate&&dueWhat&&!dueAlt) need.push(dueWhat);
const b=need.length?await bilingual(need):null; let bi=0;
const pair=(v,alt)=>{ if(!v) return ["",""]; if(alt) return lang==="es"?[alt,v]:[v,alt]; const en=b.en[bi], es=b.es[bi]; bi++; return [en||v,es||v]; };
if(note){ const [en,es]=pair(note,noteAlt); o.note=en; o.note_es=es; }
if(dueDate){ const [en,es]=pair(dueWhat||T2("Follow-up","Seguimiento"),dueAlt||(dueWhat?"":T2("Seguimiento","Follow-up"))); o.due={d:dueDate,what:en,what_es:es}; }
if(num){ if(a.species==="chicken"&&a.kind==="group") o.eggs=Number(num); else o.lb=Number(num); }
if(!note&&!num&&!dueDate&&photoIds.length){ o.note=`Photo record (${photoIds.length})`; o.note_es=`Registro con foto (${photoIds.length})`; }
await addEvent(a.id,o); toast(t("saved")); if(f.closest(".sheet")) closeSheet(); else { f.reset(); f.querySelectorAll(".ph-prev").forEach(b=>b.innerHTML=""); if(btn0){btn0.disabled=false;btn0.textContent=t("save");} } }
else if(f.id==="assignForm"){ const title=String(fd.get("title")||"").trim(); if(!title) return;
const area=String(fd.get("area")||"").trim(); const list=String(fd.get("checklist")||"").split("\n").map(s=>s.trim()).filter(Boolean).slice(0,12);
const btn=f.querySelector('button[type="submit"]'); if(btn){btn.disabled=true;btn.textContent=t("translating");}
const b=await bilingual([title,area,...list]);
await createTask({title:b.en[0],title_es:b.es[0],area:b.en[1],area_es:b.es[1],checklist:b.en.slice(2),checklist_es:b.es.slice(2),
assignee:fd.get("assignee"),date:fd.get("date"),priority:fd.get("priority"),animalId:fd.get("animalId"),recurring:!!fd.get("recurring")});
closeSheet(); toast(b.en[0]&&b.es[0]?t("autoTr"):t("saved")); }
else if(f.id==="animalForm"){ const tag=String(fd.get("tag")||"").trim(); if(!tag) return; const kind=fd.get("kind");
const btn=f.querySelector('button[type="submit"]'); if(btn){btn.disabled=true;btn.textContent=t("translating");}
const name=String(fd.get("name")||"").trim(), pen=String(fd.get("pen")||"").trim(), color=String(fd.get("color")||"").trim();
const b=await bilingual([pen,color]);
const doc={tag,name,species:fd.get("species"),kind,breed:String(fd.get("breed")||"").trim(),pen:b.en[0],pen_es:b.es[0],color:b.en[1],color_es:b.es[1],sex:fd.get("sex")||"",born:fd.get("born")||"",status:"Active",weights:[],events:[],due:[]};
if(kind==="group") doc.count=Number(fd.get("count")||0);
if(newPhoto){
if(S.assets){ try{ const up=await S.assets.upload(newPhoto.file); doc.photoId=up.id; }catch(e){ console.warn("upload",e&&e.code); } }
const ai=newPhoto.ai||{};
doc.events=[{d:today(),type:"obs",note:(STR.en.created+" "+(ai.summary_en||"")).trim(),note_es:(STR.es.created+" "+(ai.summary_es||"")).trim(),...evMeta(doc,{via:"photo",photoId:doc.photoId||""})}];
URL.revokeObjectURL(newPhoto.url); newPhoto=null;
}
await S.db.collection("animals").add(doc); closeSheet(); toast(t("saved")); }
}catch(err){ console.warn(err); toast(err&&err.code==="quota_exceeded"?t("storageFull"):t("saveErr")); }
});
document.addEventListener("keydown", e=>{ if(e.target.id==="askIn" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(e.target.value); } if(e.key==="Escape") closeSheet(); });
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{ if(S.view==="animals"&&S.animalId) drawCharts(); },150);});

// ---------- boot ----------
document.documentElement.lang=lang;
render();
const C = (window.claude&&window.claude.use) ? window.claude : demoClaude();
(async()=>{
let [db,sample,user,assets] = await Promise.all([C.use("db"),C.use("sample"),C.use("user"),C.use("assets")]);
// No shared database in this view (public link, phone browser, no permission): run as an on-device demo instead of a dead screen.
if(!db){ DEMO=true; db=makeLocalDB(); assets=localAssets; user=null; }
S.assets=assets;
S.db=db; S.sample=sample; S.ready=true;
if(user){ try{ const w=await user.can("data.write"); if(w===false) S.canWrite=false; }catch{} }
if(sample){ try{ const l=await sample.limits(); imgOK=!!l.images; if(!l.tools) S.sample=null; }catch{ imgOK=false; } }
if(!db){ render(); return; }
const bind=(col,key,sort)=>db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data())); if(sort) S[key].sort(sort); render(); },err=>console.warn(col,err));
db.doc("settings/handbook").onSnapshot(d=>{ handbook=d.exists?d.data():null; render(); },err=>console.warn("handbook",err));
db.collection("directives").onSnapshot(snap=>{ directives=snap.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },err=>console.warn("directives",err));
bind("animals","animals"); bind("tasks","tasks"); bind("staff","staff",(a,b)=>String(a.name).localeCompare(String(b.name)));
db.doc("settings/clock").onSnapshot(d=>{ clockCfg=d.exists?d.data():null; if(pendingClock&&pendingClock!=="ok"){ const c=pendingClock; pendingClock=null; location.hash="clockin-"+c; } render(); },err=>console.warn("clock",err));
bind("sales","sales");
db.collection("clock").onSnapshot(snap=>{ clockAll=snap.docs.map(d=>Object.assign({id:d.id},d.data())); if(S.view==="records") render(); },err=>console.warn("clockAll",err));
db.collection("clock").where("date","==",today()).onSnapshot(snap=>{ clocks=snap.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },err=>console.warn("clocks",err));
window.addEventListener("hashchange",()=>{ if(/^#clockin-/.test(location.hash)) setTimeout(handleClockHash,400); });
setTimeout(handleClockHash,1200);
// Deep link: #join opens the invite-code screen for new employees
if(location.hash==="#join"){ S.me=null; LS.set("sh.me",null); setTimeout(()=>{ render(); codeSheet(); },300); }
render();
})();
})();
</script>
